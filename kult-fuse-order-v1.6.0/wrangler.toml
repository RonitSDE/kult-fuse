# Cloudflare Worker: static dashboard from web/, API proxied by cloudflare/worker.js.
name = "kult-flux"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = ["/api/*", "/healthz"]

# Set BACKEND_URL to the v1.3 deployment before publishing this proxy.

# Render web service. A persistent disk is required: the Fuse binding and
# receipt log live in DATA_DIR, and a wiped disk must not start a second mandate
# on top of an open venue position. Disks are paid-instance only (starter or above).
# Free instances also sleep, which stops the live worker.
services:
  - type: web
    name: kult-fuse
    runtime: node
    plan: starter
    buildCommand: npm ci && npm --prefix apps/predict ci --no-audit --no-fund && npm --prefix apps/predict run check && npm --prefix apps/predict run build
    startCommand: npm start
    healthCheckPath: /api/predict/config
    disk:
      name: fuse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PREDICT_RECEIPTS_FILE
        value: /var/data/predict-receipts.json
      - key: PREDICT_ATTESTATION_KEY   # set by hand: openssl rand -hex 32 (Render's generateValue is not hex)
        sync: false
      - key: PREDICT_LIFECYCLE_FILE
        value: /var/data/predict-proofs.json
      - key: PREDICT_DEVNET_RPC
        sync: false
      - key: VITE_DEVNET_RPC
        sync: false
      - key: VITE_FEATURED_MARKETS
        sync: false
      - key: VITE_FEATURED_VAULTS
        sync: false
      - key: EVENT_SOURCE
        value: dflow
      - key: PERP_ADAPTER
        value: velocity
      - key: VELOCITY_ENV
        value: devnet
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC_URL
        sync: false
      - key: FUSE_PROGRAM_ID
        sync: false
      - key: FUSE_IDL_PATH
        value: ./deploy/idl/kult_fuse.json
      - key: POLICY_FILE
        value: ./policy.example.json
      - key: BUILD_TAG
        value: fuse-v2.1.1-predict
      - key: AUTO_WORKER
        value: "0"
      - key: FUSE_ADMIN_TOKEN
        generateValue: true
      - key: BUILD_SHA
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: DFLOW_MARKET_MINT
        sync: false
      - key: VELOCITY_RPC_URL
        sync: false
      - key: VELOCITY_PRIVATE_KEY_JSON
        sync: false
      - key: FUSE_OWNER_PRIVATE_KEY_JSON
        sync: false
      - key: FUSE_EXECUTION_PRIVATE_KEY_JSON
        sync: false
      - key: FUSE_ORACLE_PRIVATE_KEY_JSON
        sync: false
